<div class="rating">
  <span class="rating__stars" role="img" [attr.aria-label]="label()">
    @for (fill of starFills(); track $index) {
      <span class="rating__star" aria-hidden="true">
        <svg class="rating__star-icon" viewBox="0 0 24 24" focusable="false">
          <path
            d="M12 2l2.9 6.26 6.87.6-5.2 4.52 1.56 6.72L12 17.27 5.87 20.1l1.56-6.72-5.2-4.52 6.87-.6L12 2z"
          />
        </svg>
        <span class="rating__star-fill" [style.width.%]="fill">
          <svg class="rating__star-icon" viewBox="0 0 24 24" focusable="false">
            <path
              d="M12 2l2.9 6.26 6.87.6-5.2 4.52 1.56 6.72L12 17.27 5.87 20.1l1.56-6.72-5.2-4.52 6.87-.6L12 2z"
            />
          </svg>
        </span>
      </span>
    }
  </span>

  <span class="rating__value mono">{{ stars() }}</span>

  @if (!readonly()) {
    <span class="rating__actions">
      <button
        type="button"
        class="btn btn--icon rating__btn rating__btn--down"
        aria-label="Bewertung verringern"
        [disabled]="!canDecrease()"
        (click)="decrease()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 11h14v2H5z" />
        </svg>
      </button>
      <button
        type="button"
        class="btn btn--icon rating__btn rating__btn--up"
        aria-label="Bewertung erhöhen"
        [disabled]="!canIncrease()"
        (click)="increase()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z" />
        </svg>
      </button>
    </span>
  }
</div>
